<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>企業品牌服務｜專業網頁設計</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header style="background:#1a2a6c; color:white; text-align:center; padding:80px 20px;">
        <h1>創新設計，驅動未來</h1>
        <p>提供專業、簡潔且高效的數位解決方案</p>
        <button style="background:#f39c12; color:white; border:none; padding:15px 30px; border-radius:25px; cursor:pointer;">立即開始</button>
    </header>

    <section style="display:flex; justify-content:space-around; padding:50px; background:#f4f7f6; text-align:center;">
        <div style="width:30%;"><h3>🎨 卓越設計</h3><p>極致的視覺感受</p></div>
        <div style="width:30%;"><h3>⚡ 極致速度</h3><p>網頁即刻載入</p></div>
        <div style="width:30%;"><h3>🔒 安全可靠</h3><p>數據傳輸安全</p></div>
    </section>

    <section style="padding:50px; text-align:center;">
        <h2>定價方案</h2>
        <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
            <div style="border:1px solid #ddd; padding:20px; width:200px;"><h4>基礎版</h4><h3>$9.9</h3></div>
            <div style="border:3px solid #f39c12; padding:20px; width:200px;"><h4>進階版</h4><h3>$29.9</h3></div>
            <div style="border:1px solid #ddd; padding:20px; width:200px;"><h4>專業版</h4><h3>$99.9</h3></div>
        </div>
    </section>

    <footer style="text-align:center; padding:30px; background:#333; color:white;">
        <p>「這是我合作過最專業的團隊！」— 客戶好評</p>
        <p>&copy; 2026 數位企業有限公司</p>
    </footer>
</body>
</html>
